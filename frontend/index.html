<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upscaler Pro - Cloud AI Super-Resolution</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-group">
        <span class="logo-badge">PRO</span>
        <div>
          <h1 class="brand-title">Upscaler Pro</h1>
          <p class="tagline">Zero Local Strain • High Concurrency Cloud Engine</p>
        </div>
      </div>
      <div>
        <span class="badge-unlimited">⚡ Unlimited Cloud Queue — No Daily Quota</span>
      </div>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Images</div>
        <div class="stat-value" id="stat-total">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Queued</div>
        <div class="stat-value" id="stat-queued">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Processing</div>
        <div class="stat-value" id="stat-processing">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Completed</div>
        <div class="stat-value" id="stat-completed" style="color: var(--success);">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Est. Time Remaining</div>
        <div class="stat-value" id="stat-eta">0s</div>
      </div>
    </div>

    <!-- Settings Toolbar -->
    <div style="background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-bottom: 24px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between;">
      <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center;">
        <div>
          <label style="font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; display: block; margin-bottom: 4px;">Print DPI (Max 1200)</label>
          <select id="dpiSelect" style="background: #fff; border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--text-main);">
            <option value="72">72 DPI (Web)</option>
            <option value="150">150 DPI (Normal)</option>
            <option value="300" selected>300 DPI (Commercial Standard)</option>
            <option value="600">600 DPI (Fine Art)</option>
            <option value="1200">1200 DPI (Max Archival)</option>
            <option value="custom">Custom DPI...</option>
          </select>
        </div>
        <div id="customDpiContainer" style="display: none;">
          <label style="font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; display: block; margin-bottom: 4px;">Custom Value (1-1200)</label>
          <input type="number" id="customDpiInput" min="1" max="1200" value="300" style="background: #fff; border: 1px solid var(--primary); padding: 6px 10px; border-radius: 8px; font-size: 13px; font-weight: 700; width: 110px;">
        </div>
      </div>
      <div style="font-size: 12px; color: var(--primary); font-weight: 600; background: #ECEBFF; padding: 4px 10px; border-radius: 6px;">
        Max 1200 DPI Physical Tag
      </div>
    </div>

    <!-- Dropzone -->
    <div class="dropzone" id="dropzone">
      <input type="file" id="fileInput" multiple accept="image/jpeg,image/png,image/webp" style="display: none;">
      <h3 style="font-size: 18px; margin-bottom: 8px;">Drag & Drop 150+ Images Here</h3>
      <p style="color: var(--text-muted); margin-bottom: 16px; font-size: 14px;">JPG, PNG, or WEBP up to 100MB per file</p>
      <button class="btn" type="button" onclick="document.getElementById('fileInput').click()">Browse Images</button>
    </div>

    <!-- Action Bar -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px;">
      <div style="display: flex; gap: 12px; align-items: center;">
        <button class="btn" id="startBtn" onclick="startBatchProcessing()">Start Cloud Upscaling</button>
        <button class="btn btn-secondary" onclick="clearCompleted()">Clear Finished</button>
      </div>
      <div style="display: flex; gap: 12px;">
        <button class="btn btn-secondary" onclick="downloadAllZip()">📦 Download Completed ZIP</button>
        <button class="btn btn-secondary" onclick="downloadCsv()">📄 Export CSV</button>
      </div>
    </div>

    <!-- Image Gallery -->
    <div class="gallery-grid" id="galleryGrid">
      <!-- Dynamic job cards -->
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
